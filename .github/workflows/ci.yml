name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B -pl brokerage-api -am test

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: unit-tests
    outputs:
      # Tells the publish job whether this run uploaded a report to deploy
      report-uploaded: ${{ steps.pages-artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start the API and the database
        run: docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "The API did not start in time"
          docker compose logs api
          exit 1

      - name: Run API tests
        id: tests
        run: mvn -B -pl api-tests test -DbaseUrl=http://localhost:8080 -DapiKey=local-dev-key

      - name: Show API logs
        if: failure()
        run: docker compose logs api

      # Also after failed tests: the report then shows each failure with its request and response
      - name: Build the Allure report
        id: report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: mvn -B -pl api-tests allure:report

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api-tests/target/surefire-reports

      - name: Upload the Allure report for GitHub Pages
        id: pages-artifact
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: api-tests/target/site/allure-maven-plugin

      - name: Stop containers
        if: always()
        run: docker compose down -v

  publish-report:
    name: Publish the Allure report
    runs-on: ubuntu-latest
    needs: api-tests
    # Runs after failed tests too, so the published report always shows the latest run on main
    if: ${{ !cancelled() && needs.api-tests.outputs.report-uploaded == 'true' }}
    permissions:
      pages: write     # to deploy to GitHub Pages
      id-token: write  # to prove that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time: a newer run waits instead of cancelling the one in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
