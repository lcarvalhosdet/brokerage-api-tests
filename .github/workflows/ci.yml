name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn -B -pl brokerage-api -am test

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start the API and the database
        run: docker compose up -d --build

      - name: Wait for the API to be healthy
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "The API did not start in time"
          docker compose logs api
          exit 1

      - name: Run API tests
        run: mvn -B -pl api-tests test -DbaseUrl=http://localhost:8080 -DapiKey=local-dev-key

      - name: Show API logs
        if: failure()
        run: docker compose logs api

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: api-tests/target/surefire-reports

      - name: Stop containers
        if: always()
        run: docker compose down -v
