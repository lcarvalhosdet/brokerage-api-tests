spring:
  application:
    name: brokerage-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/brokerage}
    username: ${DATABASE_USER:brokerage}
    password: ${DATABASE_PASSWORD:brokerage}
  jackson:
    deserialization:
      # Reject 1.5 in an integer field instead of silently truncating it to 1
      accept-float-as-int: false
      # Reject "side": 1 instead of silently reading it as the second enum value, SELL
      fail-on-numbers-for-enums: true
      # Reject fields the API does not know, such as a limit price sent with a market order,
      # instead of silently ignoring them
      fail-on-unknown-properties: true
    generator:
      write-bigdecimal-as-plain: true

brokerage:
  api-key: ${BROKERAGE_API_KEY:local-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: health
