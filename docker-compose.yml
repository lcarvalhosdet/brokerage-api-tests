services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brokerage
      POSTGRES_USER: brokerage
      POSTGRES_PASSWORD: brokerage
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerage -d brokerage"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: brokerage-api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/brokerage
      DATABASE_USER: brokerage
      DATABASE_PASSWORD: brokerage
      BROKERAGE_API_KEY: local-dev-key
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
